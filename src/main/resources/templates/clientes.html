<html>
    <head>
        <title>TODO supply a title</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC" crossorigin="anonymous">
        
        
        
<h1 class="text-center text-primary mb-4">Registro de Clientes</h1>
        
        <p th:if ="${error}"  th:text ="${error}" ></p>
        
        
        <div class="card mx-auto shadow" style="max-width: 1000px;">
        <div class="card-body">
        
        <form th:action="@{/clientes/guardar}" th:object="${cliente}"  method ="post"> 
            <input type="hidden" th:field="*{idClientes}" />
            
            <label>NIT: </label>
            <input class="form-control form-control-sm" type="text" th:field="*{nit}" /> 
            
            <label>Nombre: </label>
            <input class="form-control form-control-sm" type="text" th:field="*{nombre}" /> 
            
            <label>Apellido: </label>
            <input class="form-control form-control-sm" type="text" th:field="*{apellido}" /> 
            
            <label>Correo: </label>
            <input class="form-control form-control-sm" type="text" th:field="*{correo}" /> 
            
            <br>
            <button  class="btn btn-success" type="submit">Guardar</button>
            
        </form>
               </div>
                </div>
        
        <div class="table-responsive mx-auto" style="max-width: 1000px;">
        <table class="table table-dark table-sm">
            <tr>
                <th>ID</th>
                <th>NIT</th>
                <th>Nombre</th>
                <th>Apellidos</th>
                <th>Correo</th>
                <th>Acciones</th>
     
            </tr>
            <br>
            <br>
               <h3>Clientes Registrados <h3>
                       
            <tr th:each="c : ${clientes}">
                <td th:text="${c.idClientes}"></td>
                <td th:text="${c.nit}"></td>
                <td th:text="${c.nombre}"></td>
                <td th:text="${c.apellido}"></td>
                <td th:text="${c.correo}"></td>
                
                <td> 
                    <!-- esta clase d-flex gap-2" coloca los botones en fla y deja un espacio-->
                    <div class="d-flex gap-2">
                        
                    <a  class="btn btn-outline-primary btn-sm" 
                        th:href="@{/clientes/editar/{id} (id=${c.idClientes})} ">
                        Editar
                    </a>
                    
                    <form th:action="@{/clientes/eliminar/{id} (id=${c.idClientes})} " method ="post">
                    
                        <button class="btn btn-outline-danger btn-sm" type="submit">
                            Eliminar
                        </button> 
                   
                </form>
                        
                         </div>
                </td>
                
            </tr>
            
        </table>
            </div>
        
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-MrcW6ZMFYlzcLA8Nl+NtUVF0sA7MsXsP1UyJoMp4YLEuNSfAP+JcXn/tWtIaxVXM" crossorigin="anonymous"></script>
        
    </body>
</html>
